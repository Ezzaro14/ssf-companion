name: ci
on: { push: { branches: [main] }, pull_request: }
jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - name: fetch the RePoE dump
        shell: bash
        run: |
          mkdir -p data
          curl -fsSL -o data/base_items.json https://raw.githubusercontent.com/lvlvllvlvllvlvl/RePoE/master/RePoE/data/base_items.json
          curl -fsSL -o data/mods.json https://raw.githubusercontent.com/lvlvllvlvllvlvl/RePoE/master/RePoE/data/mods.json
      - run: cargo xtask build-data
      - run: cargo test --workspace