services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ssf
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: ssf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssf"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
